[workspace]
members = ["crates/quai-primitives", "crates/quai-rpc", "crates/quai-provider", "crates/quai-sdk", "crates/quai-crypto", "crates/quai-wallet", "crates/quai-consensus", "crates/quai-signer", "crates/quai-abi", "crates/quai-browser", "crates/quai-payments", "crates/quai-keystore"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/mpoletiek/quai-rust-sdk"
publish = ["crates-io"]

[workspace.dependencies]
# Siblings are pinned exactly: a caret requirement on a pre-release also matches
# later pre-releases, so an exact pin on quai-sdk would not pin its siblings.
quai-primitives = { path = "crates/quai-primitives", version = "=0.1.0-alpha.6" }
quai-rpc = { path = "crates/quai-rpc", version = "=0.1.0-alpha.6", default-features = false }
quai-provider = { path = "crates/quai-provider", version = "=0.1.0-alpha.6", default-features = false }
quai-crypto = { path = "crates/quai-crypto", version = "=0.1.0-alpha.6" }
quai-wallet = { path = "crates/quai-wallet", version = "=0.1.0-alpha.6" }
quai-consensus = { path = "crates/quai-consensus", version = "=0.1.0-alpha.6" }
quai-signer = { path = "crates/quai-signer", version = "=0.1.0-alpha.6" }
quai-abi = { path = "crates/quai-abi", version = "=0.1.0-alpha.6" }
quai-browser = { path = "crates/quai-browser", version = "=0.1.0-alpha.6" }
quai-payments = { path = "crates/quai-payments", version = "=0.1.0-alpha.6" }
quai-keystore = { path = "crates/quai-keystore", version = "=0.1.0-alpha.6" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
ruint = { version = "1.20.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
# Benchmark harness only; a dev-dependency, so published crates are unaffected.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
# Cargo ignores a dependency's profile, so this governs this workspace's own
# builds, benchmarks and examples only; a consumer sets its own. The hot address
# derivation path crosses quai-wallet -> quai-crypto -> tiny-keccak per candidate,
# so cross-crate inlining is the point of the setting, not raw opt-level.
# `panic` is deliberately left at the default: aborting in a published library
# would remove a consumer's ability to catch a panic at an FFI or request boundary.
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
