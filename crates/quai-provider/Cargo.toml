[package]
name = "quai-provider"
description = "Typed Quai provider with validated reads and explicit signed submission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-provider"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[features]
default = ["http"]
http = ["quai-rpc/http", "polling"]
polling = ["dep:tokio"]
ws = ["quai-rpc/ws", "polling"]

[dependencies]
quai-primitives.workspace = true
quai-consensus.workspace = true
quai-crypto.workspace = true
quai-rpc.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
