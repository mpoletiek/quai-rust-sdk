[package]
name = "quai-sdk-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
repository = "https://github.com/mpoletiek/quai-rust-sdk"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
quai-sdk = { path = "../crates/quai-sdk", default-features = false, features = ["abi"] }
libfuzzer-sys = "=0.4.13"
quai-provider = { path = "../crates/quai-provider", default-features = false, features = ["fuzzing"] }
# `fuzzing` exposes the JSON-RPC envelope decoders and WebSocket dispatch;
# `http` supplies decode_batch and `ws` the dispatcher.
quai-rpc = { path = "../crates/quai-rpc", features = ["fuzzing", "http", "ws"] }
quai-consensus = { path = "../crates/quai-consensus" }
quai-abi = { path = "../crates/quai-abi" }
quai-primitives = { path = "../crates/quai-primitives" }
quai-keystore = { path = "../crates/quai-keystore" }
quai-payments = { path = "../crates/quai-payments" }
quai-wallet = { path = "../crates/quai-wallet", features = ["backup"] }
quai-crypto = { path = "../crates/quai-crypto" }
serde_json = "1.0"

[[bin]]
name = "transactions"
path = "fuzz_targets/transactions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi"
path = "fuzz_targets/abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wallet_import"
path = "fuzz_targets/wallet_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoding"
path = "fuzz_targets/encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixed"
path = "fuzz_targets/fixed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "head_state"
path = "fuzz_targets/head_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_envelope"
path = "fuzz_targets/rpc_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_dispatch"
path = "fuzz_targets/ws_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_responses"
path = "fuzz_targets/provider_responses.rs"
test = false
doc = false
bench = false
