[package]
name = "quai-rpc"
description = "Explicit shard routing and bounded JSON-RPC transport for Quai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-rpc"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[features]
default = ["http"]
http = ["dep:reqwest", "dep:tokio", "dep:flate2"]
ws = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio", "tokio/rt", "tokio/macros"]

[dependencies]
quai-primitives.workspace = true
ruint.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
url.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
flate2 = { version = "=1.1.10", optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
