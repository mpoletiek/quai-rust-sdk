[package]
name = "quai-wallet"
description = "Secret-conscious BIP39 and HD derivation foundation for Quai and Qi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-wallet"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[features]
default = []
sqlite = ["dep:rusqlite", "backup"]
backup = ["payments", "dep:serde", "dep:serde_json"]
payments = ["dep:quai-payments"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
quai-payments = { path = "../quai-payments", version = "0.1.0-alpha.3", optional = true }
quai-primitives.workspace = true
quai-consensus.workspace = true
quai-crypto = { path = "../quai-crypto", version = "0.1.0-alpha.3" }
bip32 = { version = "0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2.2.2", features = ["all-languages", "zeroize"] }
zeroize = "1.8"
unicode-normalization = "0.1.24"
hmac = "0.12.1"
sha2 = "0.10.9"
bs58 = { version = "0.5.1", features = ["check"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
thiserror.workspace = true
getrandom = "0.4.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
