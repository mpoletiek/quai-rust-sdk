[package]
name = "quai-sdk"
description = "Rust SDK for Quai Network — development foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-sdk"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[features]
default = ["http", "wallet"]
http = ["quai-rpc/http", "quai-provider/http"]
wallet = ["dep:quai-wallet", "dep:quai-crypto", "dep:quai-consensus", "dep:quai-signer"]
ws = ["quai-rpc/ws", "quai-provider/ws"]
# `quai-wallet/sqlite` implies its `backup` and `payments`, so quai-payments is
# compiled either way. Depending on the facade's own `backup` (which implies
# `payments`) keeps this feature graph monotone with the wallet's: without it the
# crate is linked but `quai_sdk::payments` and `payment_channels` stay cfg'd out,
# so a `sqlite` consumer pays for the dependency and cannot reach it.
sqlite = ["backup", "quai-wallet/sqlite"]
backup = ["wallet", "quai-wallet/backup", "payments"]
abi = ["dep:quai-abi", "dep:quai-consensus"]
browser = ["dep:quai-browser"]
payments = ["dep:quai-payments", "quai-wallet?/payments"]
keystore = ["dep:quai-keystore"]
# Parallel address grinding for scans that opt in with `Grinding::Parallel`.
# Native only; see quai-wallet's feature of the same name.
rayon = ["wallet", "quai-wallet/rayon"]
# Observation constructors for consumer tests; see quai-provider's feature.
test-fixtures = ["quai-provider/test-fixtures"]

[dependencies]
quai-primitives.workspace = true
quai-rpc.workspace = true
quai-provider.workspace = true
quai-wallet = { workspace = true, optional = true }
quai-crypto = { workspace = true, optional = true }
quai-consensus = { workspace = true, optional = true }
quai-signer = { workspace = true, optional = true }
quai-abi = { workspace = true, optional = true }
quai-browser = { workspace = true, optional = true }
quai-payments = { workspace = true, optional = true }
quai-keystore = { workspace = true, optional = true }
thiserror.workspace = true
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.78"

[[example]]
name = "read_network"
required-features = ["http"]

[[example]]
name = "offline_wallet"
required-features = ["wallet"]

[lints]
workspace = true

[[example]]
name = "qi_scan"
required-features = ["http", "sqlite"]

[[example]]
name = "wrapper_intents"
required-features = ["http", "abi"]

[[example]]
name = "payment_codes"
required-features = ["payments"]

[[example]]
name = "inspect_pool"
required-features = ["http"]

[[example]]
name = "inspect_blocks"
required-features = ["http"]

[[example]]
name = "artifact_deployment"
required-features = ["abi"]

[[example]]
name = "watch_qi"
required-features = ["http", "wallet"]

[[example]]
name = "qi_message"
required-features = ["wallet"]

[[example]]
name = "prove_state"
required-features = ["http"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
