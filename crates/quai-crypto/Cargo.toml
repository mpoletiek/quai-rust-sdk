[package]
name = "quai-crypto"
description = "Validated secp256k1 signatures and hashing for Quai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-crypto"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[dependencies]
quai-primitives.workspace = true
ruint.workspace = true
tiny-keccak.workspace = true
# `precomputed-tables` is one of k256's own defaults and was dropped by
# `default-features = false`. It adds a ~30KB lazily built radix-16 table for the
# generator point, turning every `k*G` from a full 256-bit ladder into table
# selects: roughly 2x on every ECDSA and Schnorr signature, since
# `ecdsa::hazmat` computes `R = ProjectivePoint::mul_by_generator(k)`. The selects
# are constant-time and the table holds no secret material.
k256 = { version = "0.13.4", default-features = false, features = ["std", "ecdsa", "schnorr", "ecdh", "precomputed-tables"] }
zeroize = "1.9"
getrandom = "0.4"
sha2 = "0.10.9"
ripemd = "0.1.3"
hmac = "0.12.1"
musig2 = { version = "0.4.1", default-features = false, features = ["k256"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# k256's rand_core 0.6 uses this older backend. Enable its Web Crypto adapter
# explicitly for browser builds, without changing the native dependency graph.
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
