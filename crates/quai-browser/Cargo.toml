[package]
name = "quai-browser"
description = "Browser Fetch, WebSocket and explicit injected-provider adapters for Quai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/mpoletiek/quai-rust-sdk"
documentation = "https://docs.rs/quai-browser"
keywords = ["quai", "qi", "blockchain"]
categories = ["cryptography"]

[dependencies]
quai-primitives.workspace = true
quai-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
quai-provider.workspace = true
quai-consensus.workspace = true
quai-crypto.workspace = true
quai-signer.workspace = true
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
quai-keystore.workspace = true
wasm-bindgen-test = "0.3.78"
quai-provider.workspace = true
quai-wallet.workspace = true
quai-crypto.workspace = true
quai-consensus.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
